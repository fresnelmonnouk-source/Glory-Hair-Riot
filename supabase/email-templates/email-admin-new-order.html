<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[ADMIN] Nouvelle commande · Glory Hair</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap');
  body { margin: 0; padding: 0; background: #1c0f15; color: #ede7d6; font-family: 'Work Sans', system-ui, sans-serif; }
  .container { max-width: 600px; margin: 0 auto; background: #1c0f15; }
  .header { background: #150c10; padding: 20px 24px; text-align: center; border-bottom: 1px solid rgba(237, 231, 214, 0.12); }
  .header h2 { font-family: 'Work Sans', system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #ede7d6; margin: 0; }
  .content { padding: 28px 24px; }
  p { font-size: 14px; line-height: 1.6; margin: 0 0 12px; }
  .order-table { width: 100%; background: #2a1720; border: 1px solid rgba(237, 231, 214, 0.12); border-collapse: collapse; margin: 16px 0; }
  .order-table th { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; background: #150c10; color: rgba(237, 231, 214, 0.6); padding: 10px; text-align: left; }
  .order-table td { padding: 12px 10px; border-top: 1px solid rgba(237, 231, 214, 0.12); font-size: 13px; }
  .status-pill { background: #6D071A; color: #ffffff; padding: 4px 10px; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 2px; }
  .muted { color: rgba(237, 231, 214, 0.6); font-size: 12px; }
  .btn { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; background: #6D071A; color: #ffffff; padding: 12px 22px; text-decoration: none; border-radius: 2px; margin: 16px 6px 0 0; }
  .btn-outline { background: transparent; color: #ede7d6; border: 1px solid rgba(237, 231, 214, 0.4); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>Nouvelle commande</h2>
  </div>
  <div class="content">
    <p><strong>Commande #{{ .OrderNumber }}</strong><br><span class="muted">{{ .OrderDate }}</span></p>
    <table class="order-table">
      <tr>
        <th>Client</th>
        <th>Total</th>
        <th>Paiement</th>
        <th>Statut</th>
      </tr>
      <tr>
        <td>{{ .CustomerName }}<br><span class="muted">{{ .CustomerEmail }}</span></td>
        <td>{{ .Total }} €</td>
        <td>{{ .PaymentMethod }}</td>
        <td><span class="status-pill">Payée</span></td>
      </tr>
    </table>
    <p class="muted">Produits ({{ .ItemCount }}) : {{ .ItemsList }}</p>
    <div>
      <a href="{{ .OrderURL }}" class="btn">Voir la commande</a>
      <a href="{{ .OrderURL }}/pack" class="btn btn-outline">Préparer le colis</a>
    </div>
  </div>
</div>
</body>
</html>
